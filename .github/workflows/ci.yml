# The gate this project was missing.
#
# Two things had already slipped through without it. `ui/scripts/export-catalogue.mjs`
# claimed in its own docstring that "CI fails if the checked-in file is stale" when there
# was no CI at all, so nothing guarded catalogue drift. And a `*.jsonl` line in .gitignore
# left a test fixture untracked — the suite was green on the machine that wrote it and
# broken for everyone else.
#
# So the jobs below are chosen for what actually broke here, not for completeness:
# check out WITHOUT the developer's working tree, prove the catalogue has not drifted,
# and run both languages' checks.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A fresh checkout, which is the thing the developer's machine can never test.
  # With the submodule, because the engine suite drives atrium's own mutation engine
  # and its recorded transport.
  python:
    name: python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A backstop under the faulthandler dump in pyproject.toml. Without either,
    # the 3.12 job that hung sat there until GitHub's six-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the declared floor in pyproject.toml; 3.12 is what a rig will have.
        # Both, because the codebase is written to the older one deliberately.
        #
        # 3.8 is pinned to ubuntu-24.04: ubuntu-latest moved to 26.04, and
        # setup-python has no 3.8 build for it ("The version '3.8' with
        # architecture 'x64' was not found for Ubuntu 26.04", 2026-11-20).
        # actions/python-versions builds 3.8.18 for 20.04, 22.04 and 24.04 only.
        include:
          - python: "3.8"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The submodule is fetched here rather than by `submodules: true` above,
      # and that is the whole point.
      #
      # `atrium` is a private repository, and this job's own GITHUB_TOKEN is
      # scoped to `plexus` — so the submodule clone comes back "Repository not
      # found", which reads like a deleted repository and is really a
      # permission. The obvious fix, handing checkout a `token:` that can read
      # atrium, is wrong: checkout uses that token for the *main* repository
      # too, so a token scoped to atrium made this job fail with a 403 on
      # plexus itself. Measured, in that order.
      #
      # Two clones, two credentials: the default token reads plexus above, and
      # ATRIUM_TOKEN reads atrium here. The token needs only `Contents: read`
      # on atrium — nothing on this repository.
      - name: Fetch atrium
        env:
          ATRIUM_TOKEN: ${{ secrets.ATRIUM_TOKEN }}
        run: |
          if [ -z "$ATRIUM_TOKEN" ]; then
            echo "ATRIUM_TOKEN is not set."
            echo "This job drives atrium's own mutation engine and recorded"
            echo "transport, so it needs the submodule. Set a token with"
            echo "Contents: read on salmg/atrium."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${ATRIUM_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          git submodule update --init --depth 1 vendor/atrium

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        # The config selected rules the code did not satisfy, and nothing ran
        # it. Now something does.
        run: ruff check plexus tests

      - name: Test
        run: pytest -q

  # The claim that the model half needs nothing but PyYAML, checked rather than
  # asserted: no submodule, no runtime extra, and the graph and repo suites still pass.
  # If someone reaches for atrium from plexus/graph.py, this is where it surfaces.
  model-without-atrium:
    name: model half stands alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # deliberately no submodules

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the base package only
        run: pip install -e . && pip install pytest

      - name: The graph model and repo integrity, with atrium absent
        run: pytest -q tests/test_graph.py tests/test_repo.py

      - name: The CLI answers without atrium
        run: |
          plexus nodes
          plexus check examples/contactless-relay.plexus.yaml
          plexus show examples/contactless-relay.plexus.yaml

  # The way the tool reaches someone who did not clone it. An editable install
  # keeps the source tree on sys.path, which hides a whole class of packaging
  # bug: the catalogue lived outside the package for a while, so `pip install .`
  # produced a `plexus` command that could not answer one subcommand. Nothing
  # here was capable of noticing, because nobody develops that way.
  installed:
    name: a real install can answer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # deliberately no submodules: the model half must install and answer
        # without atrium, which is what someone gets on first contact.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, not editable
        run: pip install .

      - name: Answer from outside the source tree
        # `cd /tmp` matters: from the repository root, the source tree is on
        # sys.path and an install this broken would still appear to work.
        run: |
          cd /tmp
          plexus nodes
          python -c "import plexus.catalogue as c; print(c.CATALOGUE_PATH); assert c.CATALOGUE_PATH.exists(); assert len(c.CATALOGUE.types) > 10"

  # The one-command path, end to end, from outside the source tree.
  #
  # Nothing else here can catch this. `pip install .` proves the model half
  # answers; the editor job proves the editor builds. Neither proves that the
  # built editor ends up inside the wheel, or that the runtime serves it beside
  # its own routes — and both of those were broken at different points: the
  # bundle 404ed because `app` is built when the module is imported, which is
  # before `up` has built anything.
  one-command:
    name: plexus up serves both halves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the editor into the package
        working-directory: ui
        run: |
          npm ci
          npm run build:bundle

      - name: Install, not editable, so only package-data carries the bundle
        run: pip install ".[runtime]"

      - name: One command, from outside the source tree
        # `--no-build` is the point: the editor must already be in the wheel.
        # `cd /tmp` because from the repository root a missing wheel file would
        # be found in the source tree and the whole test would prove nothing.
        run: |
          cd /tmp
          # `$!` rather than `%1`: job control is off in a non-interactive
          # shell, so `kill %1` would fail the step under `bash -e`.
          plexus up --no-open --no-build --port 8900 > /tmp/up.log 2>&1 &
          up=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8900/api/health >/dev/null 2>&1 && break
            sleep 1
          done

          curl -fsS http://127.0.0.1:8900/api/health | grep -q '"protocol"'
          curl -fsS http://127.0.0.1:8900/ > /tmp/page.html
          grep -q "<title>Plexus</title>" /tmp/page.html

          # An asset, not just the page: `web/assets/*` is a second package-data
          # line and a wheel can carry index.html without it.
          asset=$(grep -o "assets/[^\"]*\.js" /tmp/page.html | head -1)
          test -n "$asset"
          curl -fsS -o /dev/null "http://127.0.0.1:8900/$asset"

          kill $up
          cat /tmp/up.log

  # The parity invariant: the catalogue is authored in TypeScript and read by Python,
  # and a stale plexus/schema/catalogue.json means the two sides disagree about what a node is.
  catalogue:
    name: catalogue is not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      - name: Regenerate and diff
        working-directory: ui
        run: |
          npm run export:catalogue
          if ! git diff --exit-code -- ../plexus/schema/catalogue.json; then
            echo
            echo "plexus/schema/catalogue.json is stale."
            echo "Run 'npm run export:catalogue' in ui/ and commit the result."
            exit 1
          fi

  editor:
    name: editor typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
        working-directory: ui

      - run: npx tsc -b
        working-directory: ui

      - run: npx oxlint src
        working-directory: ui

      # The editor half had no test of its own behaviour until now: `tsc` and
      # `oxlint` prove it compiles, not that it decides anything correctly.
      # `tests/parity.test.ts` is the one that matters most — it runs the same
      # fixture graphs through this validator that `tests/test_parity.py` runs
      # through the Python one, against one shared contract file. A rule added
      # to one language and forgotten in the other fails here.
      - run: npm test
        working-directory: ui

      - run: npx vite build
        working-directory: ui
