[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plexus"
version = "0.1.0"
description = "A node canvas for atrium: wire readers, phones and mutations into a relay you can see."
readme = "README.md"
# The model, the checks and the CLI are plain Python and run on 3.8, which is
# what some of the machines this gets opened on happen to have.
#
# The `runtime` extra is the *server* — FastAPI and uvicorn — not atrium.
# Atrium arrives as a submodule under vendor/, so it is not a dependency here
# at all and its own floor is not expressible in this file. What that means in
# practice: `pip install -e .` gives you a working model and CLI on 3.8; the
# engine suite needs the submodule checked out, and atrium wants 3.11+.
requires-python = ">=3.8"
license = { text = "MIT" }

# The model and the catalogue need only PyYAML, so a machine with no reader can
# still read, check and diff a graph.  Everything that touches hardware is an
# extra, because atrium's own dependencies (pyscard, virtualsmartcard) do not
# install cleanly everywhere and should not block working on the graph itself.
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
runtime = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "websockets>=12.0",
]
# Everything needed to run the suite in `docs/install.md`, which says
# `pip install -e ".[dev]"` and then `pytest`. It could not: three test modules
# drive the WebSocket server and import fastapi, and starlette's TestClient
# needs httpx, and neither was here. It passed locally only because a developer
# who has run `plexus serve` already has the runtime extra installed.
#
# CI never caught it either, because CI had never run — the workflow triggers on
# `main` and the branch was `master` until the repository was pushed.
dev = [
  "plexus[runtime]",
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
plexus = "plexus.cli:main"

[tool.setuptools.packages.find]
include = ["plexus*"]

# Stated rather than inherited. `include-package-data` defaults to true for a
# pyproject-configured build, so the catalogue would come along anyway now that
# it sits inside the package — but that default is a setuptools decision, not
# ours, and the file it carries is the one table both halves of this project
# agree on. Naming it means a future `include-package-data = false`, or a move
# to another backend, fails loudly instead of shipping a `plexus` command that
# cannot answer a single subcommand.
[tool.setuptools.package-data]
plexus = [
  "schema/*.json",
  # The built editor, when `npm run build:bundle` has been run before
  # packaging. A wheel with it needs no Node on the far end; a wheel
  # without it still installs, and `plexus up` says what to do.
  "web/*",
  "web/assets/*",
]

[tool.ruff]
line-length = 90
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# pyupgrade's advice is for a codebase with a newer floor than this one. These
# four are not style preferences, they are the consequences of `requires-python
# = ">=3.8"`, and the config is narrowed rather than the code rewritten:
#
#   UP006/UP045  `List[x]` and `Optional[x]`. Safe to modernise only in
#                annotations, and only because of `from __future__ import
#                annotations` — but this codebase also puts them in runtime
#                positions, and having two spellings by position is worse than
#                one spelling everywhere.
#   UP031        `%` formatting. Used deliberately and consistently for
#                user-facing messages; f-strings are used where the expression
#                is the point. Both are fine, and churning 79 of them would
#                have been the whole of this change.
#   UP037        quoted annotations, which are still how a forward reference to
#                a class defined later in the same module is written here.
#
# Ruff was not run at all before this. It is in CI now, so what is selected
# here is what the code actually satisfies.
ignore = ["UP006", "UP031", "UP037", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The relay runs on its own thread, and an exception there is only a warning by
# default — a test can pass green while the thread driving the card died. It
# did, once. Make it fail.
filterwarnings = [
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]
